<!DOCTYPE html>
<html lang="en">

<head></head>

<body style="font-family:'Source Sans Pro', Arial;">
    <table border="0" width="100%" cellspacing="0" cellpadding="0" bgcolor="#fff" style="padding-bottom:14px;">
        <tbody>
            <tr>
                <td>
                    {% include 'custom_email_header.htm' %}
                    <table border="0" width="100%" cellspacing="0" cellpadding="0" style="padding-bottom:14px;">
                        <tbody>
                            <tr>
                                <td>
                                    <table border="0" width="600" cellspacing="0" cellpadding="0" style="padding-bottom:14px;">
                                        <tbody>
                                            <tr>
                                                <td>
                                                    {% if username != "" %}
                                                        <p>Dear {{username}},</p>
                                                    {% endif %}
                                                    <p>{{greeting}}</p>
                                                    {% if link != "" %}
                                                        <table border="0" cellspacing="0" cellpadding="0" role="presentation">
                                                            <tr>
                                                                <td align="center" bgcolor="#2579A4" style="border-radius: 5px;">
                                                                    <a href="{{link}}" target="_blank" style="
                                                                        font-size: 16px;
                                                                        font-family:Arial,Helvetica,sans-serif;
                                                                        color: #ffffff;
                                                                        text-decoration: none;
                                                                        padding: 12px 24px;
                                                                        display: inline-block;
                                                                        border-radius: 5px;
                                                                        font-weight: bold;
                                                                    ">
                                                                        {{link_text}}
                                                                    </a>
                                                                </td>
                                                            </tr>
                                                        </table>
                                                    {% endif %}
                                                    <p>If you experience any problems then please email <a href="mailto:{{contact_email}}">{{contact_email}}</a></p>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    {% include 'custom_email_footer.htm' %}
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
