
services:
    nginx-archesher:
      container_name: nginx-archesher
      image: nginx:latest
      ports:
        - "8080:80"
      volumes:
        - ./docker/nginx-config/default.conf:/etc/nginx/conf.d/default.conf
      networks:
        - archesher-network

    db-archesher:
      container_name: db-archesher
      image: postgis/postgis:12-3.2
      volumes:
        - ../../arches_her-postgres-data:/var/lib/postgresql/data
        - ../../arches_her-postgres-log:/var/log/postgresql
        - ./docker/init-unix.sql:/docker-entrypoint-initdb.d/init.sql # to set up the DB template
      ports:
        - '5433:5432'
      env_file: 
        - ./docker/env_file.env
      networks:
        - archesher-network
    
    elastic-bindmount-init_archesher:
      image: alpine
      container_name: elastic-bindmount-init-archesher
      restart: "no"
      entrypoint: |
        /bin/sh -c "chown 1000:1000 /esBindMount"
      volumes:
        - ../../arches_her-elasticsearch-data:/esBindMount

    elasticsearch-archesher:
      container_name: elasticsearch-archesher
      image: elasticsearch:7.17.0
      volumes:
        - ../../arches_her-elasticsearch-data:/usr/share/elasticsearch/data
      ports:
        - "9201:9200"
        - "9301:9300"
      env_file: 
        - ./docker/env_file.env
      networks:
        - archesher-network

    rabbitmq-archesher:
      container_name: rabbitmq-archesher
      image: rabbitmq:3.8-management
      hostname: my-rabbit
      volumes:
        - rabbitmq-data:/var/lib/rabbitmq/mnesia/rabbit@my-rabbit
        - rabbitmq-logs:/var/log/rabbitmq/log
      ports:
        - 5673:5672
        - 15673:15672
      networks:
        - archesher-network

    couchdb-archesher:
      container_name: couchdb-archesher
      image: couchdb:2.1.1
      ports:
        - "5985:5984"
      env_file: 
        - ./docker/env_file.env
      volumes:
        - couchdb-data:/usr/local/var/lib/couchdb
        - couchdb-log:/usr/local/var/log/couchdb
      networks:
        - archesher-network

