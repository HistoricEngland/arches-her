networks:
  archesher-network:
    name: archesher-network
    driver: bridge

volumes:
    postgres-data-keystone:
    postgres-log-keystone:
    elasticsearch-data-keystone:
    rabbitmq-logs-keystone:
    rabbitmq-data-keystone:
    couchdb-data-keystone:
    couchdb-log-keystone:
